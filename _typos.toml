[default]
# "PNGs" gets split into "PN" + "Gs", and "PnP" (Plug and Play) into "Pn" + "P".
extend-ignore-re = ["PNGs", "PnP"]

[default.extend-words]
clipt = "clipt"
# struct spa_buffer's field names, kept so the FFI reads like the C header.
datas = "datas"
# ffmpeg's audio pass-through filter.
anull = "anull"
# Win32's notification-icon constants (NIN_SELECT, NINF_KEY).
NIN = "NIN"
NINF = "NINF"
